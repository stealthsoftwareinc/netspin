[workspace]
resolver = "3"
members = [
  "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
readme = "README.md"
repository = "https://github.com/stealthsoftwareinc/netspin"
license = "Apache-2.0"

[workspace.dependencies]
bytes = { version = "1.12.1", default-features = false }
dyn-clone = "1.0.20"
rand = "0.10.2"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
